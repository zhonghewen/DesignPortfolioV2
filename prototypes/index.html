<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prototypes — Local Launcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 60px 40px;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 40px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      max-width: 900px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow .15s, transform .15s;
    }
    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.08); transform: translateY(-2px); }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .card-desc  { font-size: 12px; color: #666; line-height: 1.6; }
    .card-tag   { display: inline-block; margin-top: 14px; font-size: 11px; font-weight: 500; color: #888; background: #f0f0ee; border-radius: 4px; padding: 2px 8px; }
    .add-card {
      background: transparent;
      border: 1.5px dashed #ccc;
      border-radius: 10px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #aaa;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>Prototypes</h1>
  <p class="sub">Local launcher — open in browser, not deployed.</p>

  <div class="grid">

    <!-- ── Add a card for each prototype below ── -->
    <!-- Copy the block below, update href / title / desc / tag -->

    <!--
    <a class="card" href="./_template/index.html">
      <div class="card-title">Prototype Name</div>
      <div class="card-desc">One-line description of what this prototype demonstrates.</div>
      <span class="card-tag">Project P0</span>
    </a>
    -->

    <a class="card" href="./p1-seller-assistant/index.html">
      <div class="card-title">Seller Assistant — Opening Panel</div>
      <div class="card-desc">Click "Help" in the nav bar to open the AI assistant panel with recommended topics and input field.</div>
      <span class="card-tag">Project P1 — Agentic Support</span>
    </a>

    <div class="add-card">+ Add a prototype folder here</div>
  </div>
</body>
</html>
